<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081725">
<title>Разминка перед игрой 🏒</title>
<style>
:root{color-scheme:dark;--bg:#081725;--ice:#d9f6ff;--blue:#79d9f5;--red:#ed6270;--muted:#a9c2d0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 5%,#1d435c 0%,var(--bg) 66%)}
button{font:inherit}button:focus-visible{outline:3px solid #95e6ff;outline-offset:4px}
.rink{pointer-events:none;position:fixed;inset:0;overflow:hidden;opacity:.16}.rink:before{content:"";position:absolute;width:min(105vw,850px);height:min(155vw,1100px);border:2px solid #7eb5cf;border-radius:46%;left:50%;top:50%;transform:translate(-50%,-50%)}.rink:after{content:"";position:absolute;width:120vw;height:2px;background:var(--red);top:52%;left:50%;transform:translateX(-50%) rotate(-18deg);box-shadow:0 -120px 0 #398fbd,0 120px 0 #398fbd}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(20px,4vh,42px) 18px max(26px,env(safe-area-inset-bottom))}
.eyebrow{text-align:center;letter-spacing:.23em;text-transform:uppercase;color:var(--blue);font-size:11px;font-weight:850;margin:0 0 12px}h1{font-size:clamp(26px,5.5vw,44px);line-height:1.1;letter-spacing:-.035em;text-align:center;margin:0}.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:12px 0 0}
.main{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 0 22px}.stack{position:relative;width:min(100%,430px);min-height:clamp(390px,65vh,510px);perspective:1200px}.stack:before,.stack:after{content:"";position:absolute;inset:0;border:1px solid #38627a;border-radius:27px;background:#142f45;pointer-events:none}.stack:before{transform:translateY(16px) scale(.94);opacity:.6}.stack:after{transform:translateY(8px) scale(.97);opacity:.88}
.card{position:relative;z-index:2;width:100%;min-height:clamp(390px,65vh,510px);border:1px solid #75bcd4;border-radius:27px;background:linear-gradient(155deg,#1c465e,#10283b 66%,#0c2031);box-shadow:0 22px 60px #0008,inset 0 1px 0 #ffffff18;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:25px 22px;text-align:center;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .38s ease,filter .38s ease;overflow:hidden}
.card.tap-ready{cursor:pointer}.card.tap-ready:active{transform:scale(.99)}.card.out{transform:translateX(48px) translateY(-16px) rotate(5deg) scale(.94);opacity:0;filter:blur(3px)}.card.in{transform:translateY(12px) scale(.96);opacity:0;transition:none}
.card-top{width:100%;display:flex;gap:12px;justify-content:space-between;align-items:center}.label{color:#a4e4f4;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.12em;text-align:left}.counter{font-size:12px;color:#c7e4ec;font-variant-numeric:tabular-nums;font-weight:750}
.middle{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:15px 0}.puck{width:64px;height:24px;border-radius:50%;background:linear-gradient(#253643,#071018);border:2px solid #6e8c9b;box-shadow:0 7px 0 #050d15,0 12px 17px #0009;margin-bottom:8px}.question{font-size:clamp(24px,5.8vw,33px);font-weight:800;line-height:1.27;letter-spacing:-.025em;margin:0;overflow-wrap:anywhere}.explain{font-size:14px;line-height:1.55;color:#c2dce9;margin:0;max-width:315px}.card-bottom{width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:12px;min-height:55px}.hint{color:#b8d2df;font-size:12px}.arrow{width:37px;height:37px;border:1px solid #5c91a8;border-radius:50%;display:grid;place-items:center;font-size:19px}
.primary{border:0;border-radius:40px;background:var(--ice);color:#0d2739;font-weight:850;padding:15px 27px;min-height:48px;cursor:pointer;box-shadow:0 7px 20px #0003}.primary:active,.ghost:active{transform:scale(.97)}.ghost{background:#112f43;color:#e1f6fb;border:1px solid #4b778e;border-radius:30px;padding:11px 20px;min-height:44px;font-size:13px;font-weight:750;cursor:pointer}.actions{margin-top:29px}.footer{color:#89aaba;text-align:center;font-size:12px;line-height:1.5}.section-chip{display:inline-flex;border-radius:50px;border:1px solid #4a7c94;padding:7px 12px;font-size:11px;letter-spacing:.1em;color:#b7e3f0;text-transform:uppercase;font-weight:800}
.match-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;width:min(100%,315px)}.tile{aspect-ratio:1/1;min-height:70px;border:1px solid #5a98b5;border-radius:17px;background:#13344b;font-size:clamp(30px,8vw,44px);display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s,opacity .2s}.tile.selected{background:#2a6078;transform:scale(.95);border-color:#c2f4ff}.tile.matched{opacity:.38;cursor:default;background:#123044;border-color:#6bb18e}.tile.wrong{background:#65313f}.match-status{font-size:13px;color:#c4e5ef;min-height:20px}.match-next{margin-top:2px}.mini-note{font-size:12px;color:#90b3c6}.fade-in{animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:370px){.card{padding:21px 16px}.tile{min-height:62px}.stack,.card{min-height:390px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.card.out,.card.in{filter:none}}
</style>
</head>
<body>
<div class="rink" aria-hidden="true"></div>
<div class="page">
<header><p class="eyebrow">Game day · Mental warm-up</p><h1>Перед выходом на лёд</h1><p class="subtitle">Короткая разминка для головы перед игрой</p></header>
<main class="main">
<div class="stack"><section class="card" id="card" aria-live="polite" aria-label="Карточка разминки"></section></div>
<div class="actions"><button class="ghost" id="restart" type="button">↻ Начать заново</button></div>
</main>
<footer class="footer">Твой маленький предматчевый ритуал 🏒</footer>
</div>
<script>
// Позже добавим сюда персональные вопросы и пожелание.
const personalQuestions = [];
const finalWish = '';
const icons = ['🏒','🥅','⛸️','🏆','🧤','🪖','🏅','⭐','🔥','⚡','🎯','💪','🐻','🦊','🐯','🦁'];
const card = document.getElementById('card');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let flow = [], pos = -1, busy = false, firstPick = null, locked = false, matchedCount = 0;
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeMath(){const op=shuffle(['+','−','×'])[0];let a,b;if(op==='×'){a=rand(2,9);b=rand(2,9);}else{a=rand(7,35);b=rand(2,22);if(op==='−'&&b>a)[a,b]=[b,a];}return `${a} ${op} ${b} = ?`;}
function makeFlow(){const math=new Set();while(math.size<2)math.add(makeMath());const pool=shuffle(icons);flow=[...shuffle([...math]).map(q=>({type:'math',q})),...shuffle([0,1]).map(n=>({type:'match',icons:pool.slice(n*3,n*3+3)})),...shuffle(personalQuestions.filter(q=>String(q).trim()).map(q=>({type:'question',q}))),...(personalQuestions.length?[]:[{type:'placeholder'}]),{type:'wish'}];pos=-1;}
function top(label){return `<div class="card-top"><span class="label">${label}</span><span class="counter">${pos<0?'':`${String(pos+1).padStart(2,'0')} / ${String(flow.length).padStart(2,'0')}`}</span></div>`;}
function bottom(hint){return `<div class="card-bottom"><span class="hint">${hint}</span><span class="arrow" aria-hidden="true">→</span></div>`;}
function setTapAdvance(){card.classList.add('tap-ready');card.dataset.action='next';}
function render(){firstPick=null;locked=false;matchedCount=0;card.classList.remove('tap-ready');delete card.dataset.action;
 if(pos===-1){card.innerHTML=top('Разминка перед игрой')+`<div class="middle fade-in"><span class="section-chip">GAME DAY</span><div class="puck" aria-hidden="true"></div><h2 class="question">Самое время<br>помять твои мозги</h2><p class="explain">Два примера, две игры на внимательность и твои особенные вопросы.</p></div><div class="card-bottom"><button type="button" class="primary" id="begin">Начать разминку →</button></div>`;document.getElementById('begin').addEventListener('click',next);return;}
 const item=flow[pos];
 if(item.type==='math'){card.innerHTML=top('01 / Математика')+`<div class="middle"><span class="section-chip">Посчитай в уме</span><div class="puck" aria-hidden="true"></div><h2 class="question"></h2><p class="explain">Ответь про себя. Чтобы перейти дальше, коснись любой свободной части карточки.</p></div>`+bottom('Коснись карточки, чтобы продолжить');card.querySelector('.question').textContent=item.q;setTapAdvance();}
 else if(item.type==='match'){card.innerHTML=top('02 / Найди пары')+`<div class="middle"><span class="section-chip">Тренировка внимания</span><h2 class="question" style="font-size:25px">Найди одинаковые картинки</h2><p class="explain">Нажми на две одинаковые картинки, чтобы собрать пару</p><div class="match-board" id="board"></div><div class="match-status" id="status" aria-live="polite">Найдено пар: 0 / 3</div><button type="button" class="primary match-next" id="match-next" hidden>Следующая карточка →</button></div><div class="card-bottom"><span class="mini-note">Сначала найди все три пары</span></div>`;const tiles=shuffle([...item.icons,...item.icons]);const board=document.getElementById('board');tiles.forEach(symbol=>{const b=document.createElement('button');b.type='button';b.className='tile';b.textContent=symbol;b.setAttribute('aria-label','Картинка '+symbol);b.dataset.icon=symbol;b.addEventListener('click',()=>pick(b));board.appendChild(b);});document.getElementById('match-next').addEventListener('click',next);}
 else if(item.type==='question'){card.innerHTML=top('03 / Твои вопросы')+`<div class="middle"><span class="section-chip">Вопрос для тебя</span><div class="puck" aria-hidden="true"></div><h2 class="question"></h2><p class="explain">Подумай и коснись карточки, когда будешь готов</p></div>`+bottom('Коснись карточки, чтобы продолжить');card.querySelector('.question').textContent=item.q;setTapAdvance();}
 else if(item.type==='placeholder'){card.innerHTML=top('03 / Твои вопросы')+`<div class="middle fade-in"><span class="section-chip">Скоро здесь будут вопросы</span><h2 class="question">Твоя личная разминка</h2><p class="explain">Сюда добавим вопросы, которые ты пришлёшь позже. Они будут перемешиваться при каждом запуске.</p></div><div class="card-bottom"><button type="button" class="primary" id="placeholder-next">Дальше →</button></div>`;document.getElementById('placeholder-next').addEventListener('click',next);}
 else{card.innerHTML=top('Финальная карточка')+`<div class="middle fade-in"><span class="section-chip">GAME ON 🏒</span><div class="puck" aria-hidden="true"></div><h2 class="question" id="wish-text"></h2><p class="explain" id="wish-note"></p></div><div class="card-bottom"><button type="button" class="primary" id="again">Ещё раз ↻</button></div>`;document.getElementById('wish-text').textContent=finalWish||'Ты готов выходить на лёд!';document.getElementById('wish-note').textContent=finalWish?'':'Здесь будет твоё особенное пожелание перед матчем.';document.getElementById('again').addEventListener('click',restart);}
}
function pick(tile){if(locked||tile.disabled||tile===firstPick)return;tile.classList.add('selected');if(!firstPick){firstPick=tile;return;}const previous=firstPick;firstPick=null;locked=true;if(previous.dataset.icon===tile.dataset.icon){previous.classList.remove('selected');tile.classList.remove('selected');previous.classList.add('matched');tile.classList.add('matched');previous.disabled=true;tile.disabled=true;matchedCount++;document.getElementById('status').textContent=`Найдено пар: ${matchedCount} / 3`;locked=false;if(matchedCount===3){document.getElementById('status').textContent='Все пары найдены! Отлично 💪';document.getElementById('match-next').hidden=false;}}else{previous.classList.add('wrong');tile.classList.add('wrong');setTimeout(()=>{previous.classList.remove('selected','wrong');tile.classList.remove('selected','wrong');locked=false;},550);}}
function change(update){if(busy)return;busy=true;if(reduceMotion.matches){update();render();busy=false;return;}card.classList.add('out');setTimeout(()=>{update();render();card.classList.remove('out');card.classList.add('in');requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('in')));setTimeout(()=>{busy=false;},430);},390);}
function next(){if(pos<flow.length-1)change(()=>pos++);}
function restart(){change(()=>makeFlow());}
// Перелистывание срабатывает по нажатию на всю карточку в математике и личных вопросах.
card.addEventListener('click',event=>{if(card.dataset.action!=='next')return;if(event.target.closest('button'))return;next();});
document.getElementById('restart').addEventListener('click',restart);
makeFlow();render();
</script>
</body>
</html>
