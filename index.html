<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081725">
<title>Разминка перед игрой 🏒</title>
<style>
:root{--bg:#081725;--ice:#d9f6ff;--blue:#79d9f5;--red:#ed6270;--muted:#a9c2d0}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 5%,#1d435c 0%,var(--bg) 66%)}
button{font:inherit}
button:focus-visible{outline:3px solid #95e6ff;outline-offset:4px}
.rink{pointer-events:none;position:fixed;inset:0;overflow:hidden;opacity:.16}
.rink:before{content:"";position:absolute;width:min(105vw,850px);height:min(155vw,1100px);border:2px solid #7eb5cf;border-radius:46%;left:50%;top:50%;transform:translate(-50%,-50%)}
.rink:after{content:"";position:absolute;width:120vw;height:2px;background:var(--red);top:52%;left:50%;transform:translateX(-50%) rotate(-18deg);box-shadow:0 -120px 0 #398fbd,0 120px 0 #398fbd}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(22px,4vh,42px) 18px max(26px,env(safe-area-inset-bottom))}
header{width:100%}
.eyebrow{text-align:center;letter-spacing:.23em;text-transform:uppercase;color:var(--blue);font-size:11px;font-weight:850;margin:0 0 12px}
h1{font-size:clamp(26px,5.5vw,44px);line-height:1.1;letter-spacing:-.035em;text-align:center;margin:0}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:12px 0 0}
.main{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0 22px}
.stack{position:relative;width:min(100%,430px);min-height:clamp(410px,65vh,530px);perspective:1200px}
.stack:before,.stack:after{content:"";position:absolute;inset:0;border:1px solid #38627a;border-radius:27px;background:#142f45;pointer-events:none}
.stack:before{transform:translateY(16px) scale(.94);opacity:.6}
.stack:after{transform:translateY(8px) scale(.97);opacity:.88}
.card{position:relative;z-index:2;width:100%;min-height:clamp(410px,65vh,530px);border:1px solid #75bcd4;border-radius:27px;background:linear-gradient(155deg,#1c465e,#10283b 66%,#0c2031);box-shadow:0 22px 60px #0008,inset 0 1px 0 #ffffff18;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:25px 22px;text-align:center;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .38s ease,filter .38s ease;overflow:hidden}
.card.tap-ready{cursor:pointer}
.card.tap-ready:active{transform:scale(.99)}
.card.out{transform:translateX(48px) translateY(-16px) rotate(5deg) scale(.94);opacity:0;filter:blur(3px)}
.card.in{transform:translateY(12px) scale(.96);opacity:0;transition:none}
.card-top{width:100%;display:flex;gap:12px;justify-content:space-between;align-items:center}
.label{color:#a4e4f4;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.12em;text-align:left}
.counter{font-size:12px;color:#c7e4ec;font-variant-numeric:tabular-nums;font-weight:750}
.middle{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:15px 0}
.puck{width:64px;height:24px;border-radius:50%;background:linear-gradient(#253643,#071018);border:2px solid #6e8c9b;box-shadow:0 7px 0 #050d15,0 12px 17px #0009;margin-bottom:8px}
.question{font-size:clamp(24px,5.8vw,33px);font-weight:800;line-height:1.27;letter-spacing:-.025em;margin:0;overflow-wrap:anywhere}
.color-word{white-space:nowrap;max-width:100%;width:100%;text-align:center;overflow-wrap:normal;word-break:keep-all;font-size:clamp(20px,7vw,42px)!important;letter-spacing:.01em!important}
.math-answer{font-size:22px;font-weight:850;color:#b8f1ff;background:#0b2537;border:1px solid #5c9db7;border-radius:16px;padding:12px 18px;box-shadow:inset 0 1px 0 #ffffff18}.math-answer[hidden]{display:none}.explain{font-size:14px;line-height:1.55;color:#c2dce9;margin:0;max-width:315px}
.card-bottom{width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:12px;min-height:55px}
.hint{color:#b8d2df;font-size:12px}
.arrow{width:37px;height:37px;border:1px solid #5c91a8;border-radius:50%;display:grid;place-items:center;font-size:19px}
.primary{border:0;border-radius:40px;background:var(--ice);color:#0d2739;font-weight:850;padding:15px 27px;min-height:50px;cursor:pointer;box-shadow:0 7px 20px #0003}
.primary:active,.ghost:active{transform:scale(.97)}
.ghost{background:#112f43;color:#e1f6fb;border:1px solid #4b778e;border-radius:30px;padding:11px 20px;min-height:44px;font-size:13px;font-weight:750;cursor:pointer}
.actions{margin-top:29px}
.footer{color:#89aaba;text-align:center;font-size:12px;line-height:1.5}
.section-chip{display:inline-flex;border-radius:50px;border:1px solid #4a7c94;padding:7px 12px;font-size:11px;letter-spacing:.1em;color:#b7e3f0;text-transform:uppercase;font-weight:800}
.match-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;width:min(100%,315px)}
.tile{aspect-ratio:1/1;min-height:70px;border:1px solid #5a98b5;border-radius:17px;background:#13344b;font-size:clamp(30px,8vw,44px);display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s,opacity .2s;color:white}
.tile.selected{background:#2a6078;transform:scale(.95);border-color:#c2f4ff}
.tile.matched{opacity:.38;cursor:default;background:#123044;border-color:#6bb18e}
.tile.wrong{background:#65313f}
.life-gameover-icon{font-size:54px;line-height:1;margin-bottom:4px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.18))}
.life-choice-actions{gap:10px}
.life-choice-actions .primary,.life-choice-actions .ghost{width:100%;max-width:290px}
.top-right{display:flex;align-items:center;gap:10px}
.life-hearts{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.life-heart{font-size:17px;line-height:1;color:#f06a78;text-shadow:0 1px 5px rgba(0,0,0,.2);transition:opacity .2s,transform .2s}
.life-heart.lost{color:#668395;opacity:.42;text-shadow:none}
.tracker-middle{gap:10px;min-height:0}
.tracker-meta{width:100%;display:flex;align-items:center;justify-content:space-between}
.tracker-clock{font-size:25px;font-weight:900;color:#d9f6ff;font-variant-numeric:tabular-nums}
.tracker-field{position:relative;width:100%;height:clamp(210px,38vh,300px);min-height:210px;border:1px solid #75bcd4;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at center,#d7f3fa 0%,#8ec5d8 100%);box-shadow:inset 0 0 0 5px rgba(255,255,255,.2),inset 0 0 25px rgba(22,78,104,.2)}
.tracker-field:before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.65);border-radius:15px;pointer-events:none}
.tracker-ball{position:absolute;width:30px;height:30px;border:2px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.28),inset -4px -5px 7px rgba(0,0,0,.18);padding:0;cursor:default;transition:background .25s}
.tracker-ball.tracker-choice{cursor:pointer}
.tracker-ball.tracker-picked{outline:3px solid #17394d;outline-offset:2px;transform:translate(-50%,-50%) scale(1.12)}
.tracker-feedback{min-height:18px;color:#c6e5ef;font-size:13px;margin:0}
.match-timer{font-size:clamp(22px,5vw,29px);font-weight:850;letter-spacing:.08em;color:#d9f6ff;font-variant-numeric:tabular-nums;margin:0 0 2px}
.best-time{
  margin-top:10px;
  padding:11px 16px;
  border:1px solid rgba(224,249,255,.78);
  border-radius:18px;
  color:#14384d;
  font-size:13px;
  font-weight:800;
  line-height:1.45;
  background:
    repeating-linear-gradient(128deg,rgba(255,255,255,.16) 0 1px,transparent 1px 13px),
    linear-gradient(145deg,rgba(231,250,255,.96),rgba(166,220,236,.94));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -5px 12px rgba(71,143,171,.12),0 5px 16px rgba(0,0,0,.12);
  max-width:100%;
}
.match-status{font-size:13px;color:#c4e5ef;min-height:20px}
.match-next{margin-top:2px}
.mini-note{font-size:12px;color:#90b3c6}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:370px){.card{padding:21px 16px}.tile{min-height:62px}.stack,.card{min-height:400px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.card.out,.card.in{filter:none}}

/* Quiet visual-attention stages, preserving the established hockey palette. */
.attention-heading{font-size:clamp(17px,4.5vw,21px);font-weight:800;line-height:1.25;margin:0;text-align:center}
.attention-field{flex:none;position:relative;overflow:hidden;background:linear-gradient(135deg,#183e57,#0d273a);border-color:#679db6}
.attention-dot{position:absolute;width:19px;height:19px;border-radius:50%;background:#f1fbff;border:2px solid #c9e8f3;box-shadow:0 1px 9px #d9f6ff55;transform:translate(-50%,-50%);transition:background .12s,box-shadow .12s,transform .12s}
.attention-dot.flash{background:#f23f51;border-color:#ffd1d6;box-shadow:0 0 16px #f23f51aa;transform:translate(-50%,-50%) scale(1.3)}
.peripheral-dot{position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid #d4eaf4;box-shadow:0 1px 11px #ffffff77;transform:translate(-50%,-50%);pointer-events:none}
.aim-mark{position:absolute;left:50%;top:50%;width:38px;height:38px;border:3px solid #fa4b5b;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 13px #f44b5b33;pointer-events:none}
.aim-mark:before,.aim-mark:after{content:"";position:absolute;background:#fa4b5b;left:50%;top:50%;transform:translate(-50%,-50%)}
.aim-mark:before{width:52px;height:2px}.aim-mark:after{width:2px;height:52px}
.aim-mark span{position:absolute;left:50%;top:50%;width:6px;height:6px;background:#fa4b5b;border-radius:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div class="rink" aria-hidden="true"></div>
<div class="page">

<main class="main">
<div class="stack">
<section class="card" id="card" aria-live="polite" aria-label="Карточка разминки">
  <div class="card-top"><span class="label">Разминка перед игрой</span><span class="counter">СЕЗОН 26/27</span></div>
  <div class="middle">
    <h2 class="question">Самое время<br>помять твои мозги</h2>
    <p class="explain"></p>
  </div>
  <div class="card-bottom"><button type="button" class="primary" id="begin">Начать разминку →</button></div>
</section>
</div>
<div class="actions"><button class="ghost" id="restart" type="button">↻ Начать заново</button></div>
</main>
<footer class="footer">Твой маленький предматчевый ритуал 🏒</footer>
</div>
<script>
(function(){
'use strict';
const personalQuestions = [
  "Что я контролирую сегодня?",
  "Что я хочу почувствовать после финиша?",
  "Как я справлюсь с неудачным моментом?",
  "Что я уже сделал, чтобы быть здесь?",
  "Как я хочу, чтобы меня запомнили сегодня?",
  "На чём я хочу сосредоточиться в первые минуты игры?",
  "Что помогает мне сохранять спокойствие под давлением?",
  "Каким партнёром по команде я хочу быть сегодня?",
  "Что я могу сделать для команды даже без шайбы?",
  "Как я пойму, что сегодня сыграл с полной отдачей?",
  "Какую свою сильную сторону я хочу показать на льду?",
  "Что поможет мне быстро вернуться в игру после ошибки?",
  "Как я могу поддержать партнёра в сложный момент?",
  "Что для меня значит быть надёжным игроком?",
  "Каким должен быть мой первый шаг после неудачи?",
  "Что я чувствую, когда действительно уверен в себе?",
  "Как я могу использовать волнение себе на пользу?",
  "Какую маленькую победу я хочу одержать сегодня?",
  "Что мне важно помнить в напряжённый момент матча?",
  "Как я хочу реагировать на неожиданности на льду?",
  "Что помогает мне доверять своим решениям?",
  "Какой момент на тренировках доказал мне, что я расту?",
  "Что я делаю хорошо, даже когда никто этого не замечает?",
  "Какая привычка помогает мне играть лучше?",
  "Как я хочу вести себя после пропущенной шайбы?",
  "Что я могу дать команде своим настроем?",
  "Как я пойму, что оставался собой в этой игре?",
  "Что заставляет меня любить хоккей?",
  "Когда я чувствую себя по-настоящему частью команды?",
  "Как мне не потерять концентрацию после удачного эпизода?",
  "Что я могу сделать, если игра пойдёт не по плану?",
  "Какую мысль я хочу взять с собой на лёд?",
  "Что для меня важнее одного неудачного эпизода?",
  "Как я хочу выглядеть в глазах самого себя после матча?",
  "На что я могу опереться, когда становится тяжело?",
  "Как я могу помочь команде своим решением за секунду?",
  "Что я хочу сделать смелее, чем в прошлой игре?",
  "Как я буду возвращать внимание к следующему эпизоду?",
  "Как я хочу проявить характер сегодня?",
  "Какая моя черта особенно полезна в решающие минуты?",
  "Что помогает мне не сравнивать себя с другими игроками?",
  "Как я хочу относиться к своим ошибкам сегодня?",
  "Что я могу контролировать, когда судейское решение мне не нравится?",
  "Какую задачу я поставлю себе на первую смену?",
  "Что делает меня полезным игроком вне зависимости от счёта?",
  "Что я чувствую, когда команда действует как единое целое?",
  "Какой совет я дал бы себе перед первым вбрасыванием?",
  "Как я могу сохранить ясную голову в конце матча?",
  "Что я хочу заметить в своей игре сегодня?",
  "Как мне оставаться собранным, когда я устал?",
  "Что я могу сделать, чтобы играть свободнее?",
  "Какое качество я хочу укрепить сегодня?",
  "Что поможет мне услышать партнёров даже в шуме арены?",
  "Как я хочу завершить матч независимо от результата?",
  "За что я могу поблагодарить себя уже сейчас?"
]; // 5 личных вопросов + 50 дополнительных
const finalWishes = [
  "Пусть сегодня лёд будет на твоей стороне. ❤️",
  "Играй смело. Я в тебя верю! 🏒",
  "Пусть каждая смена приносит уверенность.",
  "Лёгких ног, точных передач и улыбки после матча!",
  "Пусть шайба слушается тебя сегодня. ❤️",
  "Выходи на лёд и просто будь собой.",
  "Пусть сегодня всё сложится красиво — как ты умеешь.",
  "Лови свой момент. Я мысленно рядом. ❤️",
  "Желаю тебе кайфовать от каждой минуты на льду!",
  "Пусть игра подарит тебе повод гордиться собой."
]; // Случайное пожелание на каждую разминку.
const icons = ['🏒','🥅','⛸️','🏆','🧤','🪖','🏅','⭐','🔥','⚡','🎯','💪','🐻','🦊','🐯','🦁'];
const card = document.getElementById('card');
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let flow = [], pos = -1, busy = false, firstPick = null, locked = false, matchedCount = 0;
let matchStartedAt = null, matchTimerId = null, matchElapsed = 0;
let trackerInterval = null, trackerFrame = null, trackerStageStarted = 0, trackerBalls = [], trackerTargets = 0, trackerSelecting = false, trackerSelected = [];
let lives = 3;
function updateLives(){
  const node=document.getElementById('life-hearts');
  if(node) node.innerHTML=Array.from({length:3},(_,i)=>'<span class="life-heart '+(i<lives?'alive':'lost')+'">♥</span>').join('');
}
function loseLife(){
  if(lives<=0)return false;
  lives--;
  updateLives();
  if(lives===0){
    const current=flow[pos];
    stopTracker();
    const trackerBlock = current && current.type==='tracker';
    const matchIndexes=flow.map((entry,index)=>entry.type==='match'?index:-1).filter(index=>index>=0);
    const matchBlock = current && current.type==='match' || matchIndexes.includes(pos);

    if(trackerBlock || matchBlock){
      stopMatchTimer();
      const retryId=trackerBlock?'retry-tracker':'retry-match';
      const skipId=trackerBlock?'skip-tracker':'skip-match';
      const nextRulesNumber=trackerBlock?'3':'2';
      card.innerHTML=top('Жизни закончились')+
        '<div class="middle fade-in"><div class="life-gameover-icon" aria-hidden="true">💔</div><h2 class="question">Все жизни потрачены</h2><p class="explain">Как поступим дальше?</p></div>'+
        '<div class="card-bottom life-choice-actions">'+
        '<button type="button" class="primary" id="'+retryId+'">↻ Начать блок заново</button>'+
        '<button type="button" class="ghost" id="'+skipId+'">→ Перейти к следующему блоку</button>'+
        '</div>';

      document.getElementById(retryId).addEventListener('click',()=>{
        lives=3;
        firstPick=null;locked=false;matchedCount=0;
        if(trackerBlock){
          const first=flow.findIndex(entry=>entry.type==='tracker');
          change(()=>{pos=first;});
        }else{
          matchStartedAt=null;matchElapsed=0;
          const first=flow.findIndex(entry=>entry.type==='match');
          startMatchTimer();
          change(()=>{pos=first;});
        }
      });
      document.getElementById(skipId).addEventListener('click',()=>{
        const nextBlock=flow.findIndex((entry,index)=>index>pos && entry.type==='rules' && entry.number===nextRulesNumber);
        if(nextBlock>=0){lives=3;change(()=>{pos=nextBlock;});}
      });
      updateLives();
      return false;
    }

    stopMatchTimer();
    card.innerHTML=top('Жизни закончились')+
      '<div class="middle fade-in"><div class="life-gameover-icon" aria-hidden="true">💔</div><h2 class="question">Все жизни потрачены</h2><p class="explain">Попробуй ещё раз и побей свой результат!</p></div>'+
      '<div class="card-bottom"><button type="button" class="primary" id="life-restart">Повторить разминку ↻</button></div>';
    document.getElementById('life-restart').addEventListener('click',restart);
    updateLives();
    return false;
  }
  return true;
}

const BEST_TIME_KEY = 'hockey-training-best-match-time';
function readBestTime(){
  try { const value = Number(localStorage.getItem(BEST_TIME_KEY)); return Number.isFinite(value) && value > 0 ? value : null; }
  catch(e){ return null; }
}
function formatTime(ms){
  const safe = Math.max(0, Math.floor(ms));
  const minutes = Math.floor(safe / 60000);
  const seconds = Math.floor((safe % 60000) / 1000);
  const tenths = Math.floor((safe % 1000) / 100);
  return String(minutes).padStart(2,'0') + ':' + String(seconds).padStart(2,'0') + '.' + tenths;
}
function stopTracker(){
  if(trackerInterval){clearInterval(trackerInterval);trackerInterval=null;}
  if(trackerFrame){cancelAnimationFrame(trackerFrame);trackerFrame=null;}
}
function stopMatchTimer(){
  if(matchTimerId){ clearInterval(matchTimerId); matchTimerId = null; }
}
function startMatchTimer(){
  stopMatchTimer();
  matchStartedAt = performance.now();
  matchElapsed = 0;
  matchTimerId = setInterval(()=>{
    if(matchStartedAt === null) return;
    matchElapsed = performance.now() - matchStartedAt;
    const display = document.getElementById('match-timer');
    if(display) display.textContent = formatTime(matchElapsed);
  },100);
}
function finishMatchTimer(){
  if(matchStartedAt === null) return;
  matchElapsed = performance.now() - matchStartedAt;
  matchStartedAt = null;
  stopMatchTimer();
  const previous = readBestTime();
  if(previous === null || matchElapsed < previous){
    try { localStorage.setItem(BEST_TIME_KEY, String(Math.round(matchElapsed))); } catch(e){}
  }
  const display = document.getElementById('match-timer');
  if(display) display.textContent = formatTime(matchElapsed);
}
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
function shuffle(list){
  const a=list.slice();
  for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function makeFlow(){
  const pool=shuffle(icons);
  const questionItems=shuffle(personalQuestions.filter(q=>String(q).trim())).slice(0,5).map(q=>({type:'question',q:q}));
  flow=[
    {type:'rules',number:'1',block:'01 / Найди пары',title:'Найди все одинаковые пары',body:'На поле 12 картинок. Нужно найти 6 одинаковых пар. Когда соберёшь все пары, сможешь перейти дальше.'},
    ...shuffle([0,1]).map(n=>({type:'match',icons:pool.slice(n*6,n*6+6)})),
    {type:'rules',number:'2',block:'02 / Тренировка внимания',title:'Три упражнения на внимание',body:''},
    {type:'tracker',stage:1,targets:1},
    {type:'tracker',stage:2,targets:2},
    {type:'tracker',stage:3,targets:3},
    {type:'blink',stage:2},
    {type:'peripheral',stage:3},
    {type:'rules',number:'3',block:'03 / Вопросы на раскрытие тебя',title:'Время подумать',body:'Прочитай вопрос и ответь на него про себя. Не торопись: здесь важнее твоё внутреннее ощущение.'},
    ...(questionItems.length?questionItems:[{type:'placeholder'}]),
    {type:'wish',text:finalWishes[rand(0,finalWishes.length-1)]}
  ];
  pos=-1;
}
function top(label){
  return '<div class="card-top"><span class="label">'+label+'</span><span class="top-right"><span class="counter">'+(pos<0?'СЕЗОН 26/27':String(pos+1).padStart(2,'0')+' / '+String(flow.length).padStart(2,'0'))+'</span>'+(pos>=0?'<span class="life-hearts" id="life-hearts" aria-label="Осталось жизней"></span>':'')+'</span></div>';
}
function bottom(hint){
  return '<div class="card-bottom"><span class="hint">'+hint+'</span><span class="arrow" aria-hidden="true">→</span></div>';
}
function setTapAdvance(){card.classList.add('tap-ready');card.dataset.action='next';}
function render(){
  firstPick=null;locked=false;matchedCount=0;
  card.classList.remove('tap-ready');delete card.dataset.action;
  if(pos===-1){
    card.innerHTML=top('Разминка перед игрой')+
      '<div class="middle fade-in"><h2 class="question">Самое время<br>помять твои мозги</h2><p class="explain"></p><div class="best-time" id="best-time"></div></div>'+
      '<div class="card-bottom"><button type="button" class="primary" id="begin">Начать разминку →</button></div>';
    const best = readBestTime();
    document.getElementById('best-time').textContent = best === null ? 'Лучшее время в первом блоке: пока нет результата' : 'Лучшее время в первом блоке: ' + formatTime(best);
    return;
  }
  const item=flow[pos];
  if(item.type==='rules'){
    card.innerHTML=top(item.block)+
      '<div class="middle fade-in"><span class="section-chip" id="rules-label"></span><div class="puck" aria-hidden="true"></div><h2 class="question" style="font-size:clamp(23px,5vw,30px)"></h2><p class="explain rules-copy"></p></div>'+
      '<div class="card-bottom"><button type="button" class="primary" id="rules-next">Понятно, начать →</button></div>';
    document.getElementById('rules-label').textContent='Правила блока №'+item.number;
    card.querySelector('.question').textContent=item.title;
    card.querySelector('.rules-copy').textContent=item.body;
    card.querySelector('.rules-copy').hidden=!item.body;
    document.getElementById('rules-next').addEventListener('click',()=>{
      if(item.number==='1') startMatchTimer();
      next();
    });
  }else if(item.type==='tracker'){
    renderTracker(item);
  }else if(item.type==='blink'){
    renderBlinkExercise();
  }else if(item.type==='peripheral'){
    renderPeripheralExercise();
  }else if(item.type==='match'){
    card.innerHTML=top('01 / Найди пары')+
      '<div class="middle"><span class="section-chip">Тренировка внимания</span><div class="match-timer" id="match-timer" aria-live="off">00:00.0</div><div class="match-board" id="board"></div><div class="match-status" id="status" aria-live="polite">Найдено пар: 0 / 6</div></div><div class="card-bottom"><span class="mini-note"> </span></div>';
    const board=document.getElementById('board');
    shuffle(item.icons.concat(item.icons)).forEach(symbol=>{
      const b=document.createElement('button');b.type='button';b.className='tile';b.textContent=symbol;b.dataset.icon=symbol;b.setAttribute('aria-label','Картинка '+symbol);
      b.addEventListener('click',()=>pick(b));board.appendChild(b);
    });
  }else if(item.type==='question'){
    card.innerHTML=top('03 / Твои вопросы')+
      '<div class="middle"><span class="section-chip">Вопрос для тебя</span><div class="puck" aria-hidden="true"></div><h2 class="question"></h2></div>'+
      bottom('Коснись карточки, чтобы продолжить');
    card.querySelector('.question').textContent=item.q;setTapAdvance();
  }else if(item.type==='placeholder'){
    card.innerHTML=top('03 / Твои вопросы')+
      '<div class="middle fade-in"><span class="section-chip">Скоро здесь будут вопросы</span><h2 class="question">Твоя личная разминка</h2></div>'+
      '<div class="card-bottom"><button type="button" class="primary" id="placeholder-next">Дальше →</button></div>';
    document.getElementById('placeholder-next').addEventListener('click',next);
  }else{
    card.innerHTML=top('Маленькое пожелание')+
      '<div class="middle fade-in"><div class="puck" aria-hidden="true"></div><h2 class="question" id="wish-text"></h2><p class="explain" id="wish-note"></p></div>'+
      '<div class="card-bottom"><button type="button" class="primary" id="again">Ещё раз ↻</button></div>';
    document.getElementById('wish-text').textContent=item.text;
    document.getElementById('again').addEventListener('click',restart);
  }
  updateLives();
}


// Two quiet attention exercises: 20 seconds each, with automatic progression.
function renderBlinkExercise(){
  stopTracker();
  card.innerHTML=top('02 / Тренировка внимания')+
    '<div class="middle tracker-middle"><span class="section-chip">Этап 2 / 3</span>'+
    '<h2 class="attention-heading">Следи за красными вспышками</h2>'+
    '<div class="tracker-field attention-field blink-field" id="blink-field" aria-label="Поле с мигающими точками"></div>'+
    '<p class="tracker-feedback" id="blink-feedback">Следи глазами за точками, которые загораются красным.</p>'+
    '<button type="button" class="primary" id="blink-start">Начнём →</button></div>';
  const field=document.getElementById('blink-field');
  const positions=[[15,18],[48,13],[82,19],[23,42],[68,39],[87,57],[13,74],[44,81],[75,76]];
  const points=positions.map(([x,y])=>{
    const dot=document.createElement('span');
    dot.className='attention-dot';
    dot.style.left=x+'%';dot.style.top=y+'%';
    field.appendChild(dot);
    return dot;
  });
  document.getElementById('blink-start').addEventListener('click',()=>{
    document.getElementById('blink-start').remove();
    const started=performance.now();
    let last=-1,active=-1,nextFlash=started;
    function tick(){
      const now=performance.now();
      const elapsed=now-started;
      if(elapsed>=20000){
        stopTracker();next();return;
      }
      if(now<nextFlash)return;
      if(active>=0)points[active].classList.remove('flash');
      const choices=points.map((_,i)=>i).filter(i=>i!==last);
      active=choices[rand(0,choices.length-1)];
      last=active;
      points[active].classList.add('flash');
      // Gradually accelerate the flashes, from 780ms to 190ms.
      const interval=780-(590*Math.min(1,elapsed/20000));
      nextFlash=now+interval;
    }
    tick();
    trackerInterval=setInterval(tick,30);
  },{once:true});
}
function renderPeripheralExercise(){
  stopTracker();
  card.innerHTML=top('02 / Тренировка внимания')+
    '<div class="middle tracker-middle"><span class="section-chip">Этап 3 / 3</span>'+
    '<h2 class="attention-heading">Смотри в центр</h2>'+
    '<div class="tracker-field attention-field peripheral-field" id="peripheral-field" aria-label="Красный прицел в центре и движущаяся белая точка">'+
    '<div class="aim-mark" aria-hidden="true"><span></span></div>'+
    '<span class="peripheral-dot" id="peripheral-dot" style="left:85%;top:50%"></span></div>'+
    '<p class="tracker-feedback">Не отводи взгляд от прицела. Замечай движение по краям поля.</p>'+
    '<button type="button" class="primary" id="peripheral-start">Начнём →</button></div>';
  const dot=document.getElementById('peripheral-dot');
  const field=document.getElementById('peripheral-field');
  document.getElementById('peripheral-start').addEventListener('click',()=>{
    document.getElementById('peripheral-start').remove();
    const started=performance.now();
    let lastFrame=started,phase=0;
    function animate(now){
      if(now-started>=20000){
        stopTracker();next();return;
      }
      const elapsed=Math.min((now-lastFrame)/1000,.05);
      lastFrame=now;
      phase+=elapsed*1.7;
      const w=field.clientWidth,h=field.clientHeight;
      const radiusX=Math.max(50,w*.36),radiusY=Math.max(58,h*.35);
      const x=w/2+radiusX*Math.cos(phase);
      const y=h/2+radiusY*Math.sin(phase*1.21);
      dot.style.left=x+'px';dot.style.top=y+'px';
      trackerFrame=requestAnimationFrame(animate);
    }
    trackerFrame=requestAnimationFrame(animate);
  },{once:true});
}

function renderTracker(item){
  trackerTargets=item.targets;
  trackerSelecting=false;
  trackerSelected=[];
  const count=10;
  const colors=['#55baff','#62dc91','#ffd45c','#c49aff','#ff9b4a','#f4f7fb'];
  const targetIndexes=new Set(shuffle(Array.from({length:count},(_,i)=>i)).slice(0,item.targets));
  trackerBalls=Array.from({length:count},(_,i)=>({
    x:rand(8,88),y:rand(12,82),
    vx:(Math.random()<.5?-1:1)*(0.55+item.stage*.42+Math.random()*.25),
    vy:(Math.random()<.5?-1:1)*(0.45+item.stage*.38+Math.random()*.25),
    target:targetIndexes.has(i),el:null
  }));
  card.innerHTML=top('02 / Следи за шариками')+
    '<div class="middle tracker-middle"><div class="tracker-meta"><span class="section-chip">Этап 1 / 3 · Режим '+item.stage+' / 3</span><span class="tracker-clock" id="tracker-clock">15</span></div><p class="explain" id="tracker-instruction">Следи за '+item.targets+' красн'+(item.targets===1?'ым шариком':'ыми шариками')+'. Запоминай, где они окажутся.</p><div class="tracker-field" id="tracker-field" aria-label="Поле с движущимися шариками"></div><p class="tracker-feedback" id="tracker-feedback" aria-live="polite">Шарики двигаются — не теряй цель!</p></div>';
  const field=document.getElementById('tracker-field');
  const fieldRect=field.getBoundingClientRect();
  // Place balls without overlap at the start of each round.
  trackerBalls.forEach((ball,index)=>{
    let attempts=0, valid=false;
    while(!valid && attempts<250){
      attempts++;
      ball.x=rand(7,91);
      ball.y=rand(9,87);
      const px=ball.x*fieldRect.width/100, py=ball.y*fieldRect.height/100;
      valid=trackerBalls.slice(0,index).every(other=>{
        const ox=other.x*fieldRect.width/100, oy=other.y*fieldRect.height/100;
        return Math.hypot(px-ox,py-oy)>=40;
      });
    }
  });
  trackerBalls.forEach(ball=>{
    const el=document.createElement('button');
    el.type='button';el.className='tracker-ball';
    el.style.left=ball.x+'%';el.style.top=ball.y+'%';
    el.style.background=ball.target?'#f04452':colors[rand(0,colors.length-1)];
    el.setAttribute('aria-label','Шарик');
    el.addEventListener('click',()=>selectTrackerBall(ball,el,item));
    field.appendChild(el);ball.el=el;
  });
  trackerStageStarted=performance.now();
  const speed=[0,4.1,4.6,5.2][item.stage];
  function move(){
    if(trackerSelecting)return;
    const rect=field.getBoundingClientRect();
    const maxX=Math.max(5,100-100*34/Math.max(rect.width,1));
    const maxY=Math.max(8,100-100*34/Math.max(rect.height,1));
    trackerBalls.forEach(ball=>{
      ball.x+=ball.vx*speed*.20;ball.y+=ball.vy*speed*.20;
      if(ball.x<4||ball.x>maxX){ball.vx*=-1;ball.x=Math.max(4,Math.min(maxX,ball.x));}
      if(ball.y<7||ball.y>maxY){ball.vy*=-1;ball.y=Math.max(7,Math.min(maxY,ball.y));}
    });

    // Elastic collisions: balls bounce off one another instead of passing through.
    const minDistance=35;
    for(let i=0;i<trackerBalls.length;i++){
      for(let j=i+1;j<trackerBalls.length;j++){
        const a=trackerBalls[i], b=trackerBalls[j];
        let dx=(b.x-a.x)*rect.width/100;
        let dy=(b.y-a.y)*rect.height/100;
        let distance=Math.hypot(dx,dy);
        if(distance<minDistance){
          if(distance<0.001){dx=1;dy=0;distance=1;}
          const nx=dx/distance, ny=dy/distance;
          const overlap=minDistance-distance;
          // Separate both balls so their hit areas never remain stacked.
          a.x-=nx*overlap*.51*100/rect.width;
          a.y-=ny*overlap*.51*100/rect.height;
          b.x+=nx*overlap*.51*100/rect.width;
          b.y+=ny*overlap*.51*100/rect.height;

          const avx=a.vx*rect.width/100, avy=a.vy*rect.height/100;
          const bvx=b.vx*rect.width/100, bvy=b.vy*rect.height/100;
          const relative=(bvx-avx)*nx+(bvy-avy)*ny;
          if(relative<0){
            a.vx=(avx+relative*nx)*100/rect.width;
            a.vy=(avy+relative*ny)*100/rect.height;
            b.vx=(bvx-relative*nx)*100/rect.width;
            b.vy=(bvy-relative*ny)*100/rect.height;
          }
        }
      }
    }
    trackerBalls.forEach(ball=>{
      ball.x=Math.max(4,Math.min(maxX,ball.x));
      ball.y=Math.max(7,Math.min(maxY,ball.y));
      ball.el.style.left=ball.x+'%';
      ball.el.style.top=ball.y+'%';
    });
    trackerFrame=requestAnimationFrame(move);
  }
  trackerFrame=requestAnimationFrame(move);
  trackerInterval=setInterval(()=>{
    const left=Math.max(0,15-Math.floor((performance.now()-trackerStageStarted)/1000));
    const clock=document.getElementById('tracker-clock');
    if(clock)clock.textContent=String(left);
    if(left<=0)endTrackerStage(item);
  },100);
}
function endTrackerStage(item){
  if(trackerSelecting)return;
  trackerSelecting=true;stopTracker();
  const field=document.getElementById('tracker-field');
  const rect=field.getBoundingClientRect();
  for(let pass=0;pass<8;pass++){
    for(let i=0;i<trackerBalls.length;i++){
      for(let j=i+1;j<trackerBalls.length;j++){
        const a=trackerBalls[i],b=trackerBalls[j];
        let dx=(b.x-a.x)*rect.width/100,dy=(b.y-a.y)*rect.height/100;
        let d=Math.hypot(dx,dy);
        if(d<37){
          if(d<.001){dx=1;dy=0;d=1;}
          const nx=dx/d,ny=dy/d,shift=(37-d)*.52;
          a.x-=nx*shift*100/rect.width;a.y-=ny*shift*100/rect.height;
          b.x+=nx*shift*100/rect.width;b.y+=ny*shift*100/rect.height;
        }
      }
    }
  }
  trackerBalls.forEach(ball=>{
    ball.x=Math.max(5,Math.min(95,ball.x));
    ball.y=Math.max(7,Math.min(93,ball.y));
    ball.el.style.left=ball.x+'%';
    ball.el.style.top=ball.y+'%';
    ball.el.style.background='linear-gradient(145deg,#d9f6ff,#8ebbd0)';
    ball.el.classList.add('tracker-choice');
  });
  const instruction=document.getElementById('tracker-instruction');
  const feedback=document.getElementById('tracker-feedback');
  if(instruction)instruction.textContent='Где были красные шарики? Выбери '+trackerTargets+' '+(trackerTargets===1?'позицию':'позиции')+'.';
  if(feedback)feedback.textContent='Выбрано: 0 / '+trackerTargets;
  const clock=document.getElementById('tracker-clock');if(clock)clock.textContent='ВЫБОР';
}
function selectTrackerBall(ball,el,item){
  if(!trackerSelecting||el.disabled)return;
  if(trackerSelected.includes(ball))return;
  trackerSelected.push(ball);el.classList.add('tracker-picked');
  if(!ball.target && !loseLife())return;
  const feedback=document.getElementById('tracker-feedback');
  if(feedback)feedback.textContent='Выбрано: '+trackerSelected.length+' / '+trackerTargets;
  if(trackerSelected.length===trackerTargets){
    const correct=trackerSelected.filter(b=>b.target).length;
    if(feedback)feedback.textContent=correct===trackerTargets?'Верно! Отличная концентрация 💪':'Этап завершён. Продолжаем тренировку.';
    trackerBalls.forEach(b=>b.el.disabled=true);
    window.setTimeout(()=>next(),900);
  }
}
function pick(tile){
  if(locked||tile.disabled||tile===firstPick)return;
  tile.classList.add('selected');
  if(!firstPick){firstPick=tile;return;}
  const previous=firstPick;firstPick=null;locked=true;
  if(previous.dataset.icon===tile.dataset.icon){
    previous.classList.remove('selected');tile.classList.remove('selected');
    previous.classList.add('matched');tile.classList.add('matched');
    previous.disabled=true;tile.disabled=true;matchedCount++;
    document.getElementById('status').textContent='Найдено пар: '+matchedCount+' / 6';
    locked=false;
    if(matchedCount===6){
      document.getElementById('status').textContent='Все пары найдены! Отлично 💪';
      const matchPositions = flow.map((entry,index)=>entry.type==='match'?index:-1).filter(index=>index>=0);
      const isLastMatch = matchPositions.length && pos===matchPositions[matchPositions.length-1];
      if(isLastMatch) finishMatchTimer();
      locked = true;
      window.setTimeout(()=>next(),700);
    }
  }else{
    previous.classList.add('wrong');tile.classList.add('wrong');
    if(!loseLife())return;
    window.setTimeout(()=>{previous.classList.remove('selected','wrong');tile.classList.remove('selected','wrong');locked=false;},550);
  }
}
function change(update){
  if(busy)return;stopTracker();busy=true;
  if(reduceMotion){update();render();busy=false;return;}
  card.classList.add('out');
  window.setTimeout(()=>{
    update();render();card.classList.remove('out');card.classList.add('in');
    requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('in')));
    window.setTimeout(()=>{busy=false;},430);
  },390);
}
function next(){if(pos<flow.length-1)change(()=>{pos++;});}
function restart(){stopTracker();stopMatchTimer();matchStartedAt=null;matchElapsed=0;lives=3;change(()=>makeFlow());}
card.addEventListener('click',event=>{
  if(event.target.closest('button'))return;
  if(card.dataset.action==='next')next();
});
card.addEventListener('click',event=>{
  if(event.target && event.target.id==='begin')next();
});
document.getElementById('restart').addEventListener('click',restart);
try{makeFlow();render();}
catch(error){
  card.innerHTML='<div class="middle"><h2 class="question">Не удалось запустить разминку</h2><p class="explain">Обнови страницу. Если ошибка повторится, сообщи об этом.</p></div>';
  console.error(error);
}
})();
</script>
